<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./0307 черный фон_Монтажная область 1.webp" sizes="96x96" />
    <link rel="shortcut icon" href="./0307 черный фон_Монтажная область 1.webp" />
    <link rel="apple-touch-icon" sizes="180x180" href="./0307 черный фон_Монтажная область 1.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="">
    <title></title>

  <link rel="preconnect" href="https://www.googletagmanager.com">
  <link rel="dns-prefetch" href="https://www.googletagmanager.com">
  
  <script type="module">
    import { initChatWidget } from './src/chat-widget.js';
    initChatWidget(); // ids опциональны
  </script>
    <link rel="stylesheet" crossorigin href="./style.css">
  </head>
  <body>
        <button
          type="button"
          id="chat-trigger"
          class="gradient-border fixed bottom-6 right-6 z-50 cursor-pointer inline-flex items-center gap-3 px-6 py-4 text-white shadow-lg shadow-black/30 transition-transform duration-200 hover:scale-105 active:scale-95"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#F5F5F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6 shrink-0">
            <path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/>
          </svg>
          <span class="font-extrabold font-Unbounded text-[16px] tracking-wide whitespace-nowrap">Спросить у AI</span>
        </button>
      
        <!-- Панель чата -->
        <section
          id="chat-panel"
          class="hidden fixed bottom-6 right-6 z-50 w-[380px] max-w-[92vw] h-[600px] max-h-[85vh] flex flex-col rounded-3xl border border-white/10 bg-black shadow-2xl shadow-black/50 overflow-hidden"
        >
          <header class="flex items-center gap-3 px-5 py-4 border-b border-white/10 bg-[#111217]">
            <div class="w-10 h-10 shrink-0 rounded-xl bg-black border border-white/15 flex items-center justify-center text-white">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
                <path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/>
              </svg>
            </div>
            <div class="flex-1 min-w-0">
              <p class="font-extrabold font-Unbounded text-white text-[15px] leading-tight truncate">AI-консультант Sintex</p>
              <div class="flex items-center gap-1.5 mt-0.5">
                <span class="w-2 h-2 rounded-full bg-brand"></span>
                <span class="text-white/50 font-Unbounded text-[13px] font-medium">на связи</span>
              </div>
            </div>
            <button type="button" id="chat-close" class="w-8 h-8 shrink-0 rounded-full border border-white/15 flex items-center justify-center text-white/70 hover:text-white hover:border-white/40 transition-colors">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
                <path d="M18 6 6 18M6 6l12 12"/>
              </svg>
            </button>
          </header>
      
          <div id="chat-messages" class="flex-1 overflow-y-auto px-5 py-5 flex flex-col gap-4"></div>
      
          <footer class="px-4 py-4 border-t border-white/10 bg-[#111217] flex items-center gap-3">
            <input
              type="text"
              id="inputMessageToAI"
              placeholder="Напишите сообщение..."
              class="flex-1 rounded-full border border-white/15 bg-transparent px-5 py-3 text-[14px] font-gilroy text-white placeholder-white/40 outline-none focus:border-[#0231BF] transition-colors"
            />
            <button type="button" id="sendMessageToAI" class="w-11 h-11 shrink-0 rounded-full bg-[#0231BF] flex items-center justify-center hover:scale-105 active:scale-95 transition-transform">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#F5F5F7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
                <path d="m3 3 18 9-18 9 4.5-9L3 3Z"/>
              </svg>
            </button>
          </footer>
        </section>
  </body>
</html>
